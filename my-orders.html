<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার অর্ডার | Sera Product</title>
    
    <!-- Meta and SEO -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ff6a00">
    <link rel="icon" href="https://seraproduct.com/photo/logo.png" type="image/png">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="my-orders.css">
</head>
<body>

    <!-- Global Custom Loading Overlay -->
    <div id="globalLoader" class="loader-overlay">
        <div class="loader-content">
            <img src="https://seraproduct.com/loading.gif" alt="লোডিং..." class="loader-gif">
            <p id="loaderText">তথ্য লোড হচ্ছে...</p>
        </div>
    </div>

    <!-- Toast Notification System -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Header Section -->
    <header class="site-header">
        <div class="container header-content">
            <a href="https://seraproduct.com" class="brand-logo-link">
                <img src="https://seraproduct.com/photo/header.png" alt="Sera Product Header Logo" class="header-logo">
            </a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="container">
            
            <!-- Page Title & Subtitle -->
            <section class="page-heading-section">
                <h1 class="page-title">আমার অর্ডার</h1>
                <p class="page-subtitle">আপনার করা অর্ডারগুলোর তথ্য ও বর্তমান অবস্থা এখানে দেখতে পারবেন।</p>
            </section>

            <!-- Search and Filter Controls -->
            <section class="controls-section">
                <!-- Search Box for Order ID Only -->
                <div class="search-box-wrapper">
                    <span class="search-icon">
                        <svg viewBox="0 0 24 24" class="svg-icon"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </span>
                    <input type="text" id="orderSearchInput" placeholder="অর্ডার আইডি দিয়ে খুঁজুন..." class="search-input">
                    <button id="clearSearchBtn" class="clear-search-btn hidden" aria-label="Clear Search">
                        <svg viewBox="0 0 24 24" class="svg-icon"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>

                <!-- Status Filter Dropdown -->
                <div class="filter-box-wrapper">
                    <select id="statusFilter" class="status-select">
                        <option value="all">সব অর্ডার</option>
                        <option value="pending">নতুন অর্ডার</option>
                        <option value="confirm">অর্ডার গ্রহণ করা হয়েছে!</option>
                        <option value="processing">কোরিয়ারে পাঠানো হয়েছে!</option>
                        <option value="return">অর্ডার রিটার্ন করা হয়েছে!</option>
                        <option value="delivery">অর্ডার সফল ভাবে ডেলিভারি করা হয়েছে!</option>
                        <option value="cancel">অর্ডার বাতিল করা হয়েছে!</option>
                    </select>
                </div>
            </section>

            <!-- Orders Container -->
            <section id="ordersContainer" class="orders-container">
                <!-- Dynamic Order Cards Will Render Here -->
            </section>

            <!-- Empty State Display -->
            <section id="emptyState" class="empty-state hidden">
                <div class="empty-card">
                    <svg viewBox="0 0 24 24" class="empty-icon"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h6v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/></svg>
                    <h3 id="emptyStateMessage">আপনার এখনো কোনো অর্ডার নেই।</h3>
                    <a href="https://seraproduct.com" class="btn btn-primary btn-shop">পণ্য দেখতে যান</a>
                </div>
            </section>

            <!-- Pagination Load More Button -->
            <div id="paginationWrapper" class="pagination-wrapper hidden">
                <button id="loadMoreBtn" class="btn btn-secondary">
                    <span>আরোও দেখুন</span>
                    <svg viewBox="0 0 24 24" class="svg-icon"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </button>
            </div>

        </div>
    </main>

    <!-- Footer Container (Fetched Dynamically) -->
    <footer id="dynamicFooter" class="site-footer">
        <div class="footer-loader">
            <img src="https://seraproduct.com/loading.gif" alt="Footer Loading..." class="footer-loader-gif">
        </div>
    </footer>

    <!-- Firebase SDK Modular Import via ES Modules -->
    <script type="module" src="my-orders.js"></script>
</body>
</html>
