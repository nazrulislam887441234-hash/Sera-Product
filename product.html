<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff6a00">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="https://seraproduct.com/photo/logo.png">

    <!-- Dynamic SEO Placeholders -->
    <title id="meta-title">Sera Product</title>
    <meta name="description" id="meta-description" content="Sera Product Details">
    <link rel="canonical" id="meta-canonical" href="https://seraproduct.com/product">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="product">
    <meta property="og:title" id="og-title" content="Sera Product">
    <meta property="og:description" id="og-description" content="Sera Product Details">
    <meta property="og:image" id="og-image" content="">
    <meta property="og:url" id="og-url" content="">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="twitter-title" content="Sera Product">
    <meta name="twitter:description" id="twitter-description" content="Sera Product Details">
    <meta name="twitter:image" id="twitter-image" content="">

    <!-- Structured Data JSON-LD -->
    <script type="application/ld+json" id="structured-data">{}</script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="product.css">
</head>
<body>

    <!-- Header Section -->
    <header class="sera-header">
        <div class="header-container">
            <a href="https://seraproduct.com" class="logo-link">
                <img src="https://seraproduct.com/photo/header.png" alt="Sera Product Logo" class="sera-logo">
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="sera-main-container">
        
        <!-- Loading Skeleton / Initial State -->
        <div id="loading-state" class="loading-state">
            <div class="spinner"></div>
            <p>প্রোডাক্ট লোড হচ্ছে...</p>
        </div>

        <!-- Error / Not Found State -->
        <div id="error-state" class="error-state hidden">
            <h2 id="error-message">প্রোডাক্ট খুঁজে পাওয়া যায়নি।</h2>
            <a href="https://seraproduct.com" class="sera-btn">হোম পেজে ফিরে যান</a>
        </div>

        <!-- Product Details Wrapper -->
        <div id="product-wrapper" class="product-wrapper hidden">
            
            <!-- Offer Banner -->
            <div id="offer-banner" class="offer-banner hidden">
                <div class="offer-text">এই প্রোডাক্টের অফার শেষ হবে</div>
                <div id="countdown-timer" class="countdown-timer">০ দিন ১২ ঘণ্টা ৩৪ মিনিট ৫৬ সেকেন্ড</div>
            </div>

            <div class="product-grid">
                <!-- Gallery Section -->
                <div class="product-gallery-section">
                    <div id="media-toggle" class="media-toggle hidden">
                        <button type="button" class="toggle-btn active" data-target="image-view">ছবি</button>
                        <button type="button" class="toggle-btn" data-target="video-view">ভিডিও</button>
                    </div>

                    <div id="image-view" class="main-image-container">
                        <img id="main-product-image" src="" alt="Product Image" loading="eager" decoding="async">
                    </div>

                    <div id="video-view" class="main-video-container hidden">
                        <!-- Dynamic YouTube Iframe container -->
                    </div>

                    <div id="thumbnail-container" class="thumbnail-container">
                        <!-- Thumbnails will be injected here -->
                    </div>
                </div>

                <!-- Product Info Section -->
                <div class="product-info-section">
                    <h1 id="product-title" class="product-title"></h1>
                    
                    <div class="price-container">
                        <span id="current-price" class="current-price">৳0</span>
                        <span id="old-price" class="old-price hidden">৳0</span>
                        <span id="discount-badge" class="discount-badge hidden"></span>
                    </div>

                    <div id="badges-container" class="badges-container">
                        <!-- Free delivery and warranty badges -->
                    </div>

                    <!-- Variants Area -->
                    <div id="variants-container" class="variants-container">
                        <!-- Dynamic variants will be injected here -->
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <button id="add-to-cart-btn" class="sera-btn cart-btn">কার্টে যোগ করুন</button>
                        <button id="buy-now-btn" class="sera-btn order-btn">এখনই অর্ডার করুন</button>
                    </div>

                    <!-- Description Area -->
                    <div class="description-section">
                        <h3>প্রোডাক্ট বিবরণী</h3>
                        <div id="product-description" class="product-description"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="auth-modal hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-modal">&times;</button>
            <div class="modal-tabs">
                <button type="button" class="tab-btn active" data-tab="login-tab">লগিন</button>
                <button type="button" class="tab-btn" data-tab="signup-tab">সাইনআপ</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label>ইমেইল</label>
                    <input type="email" id="login-email" required placeholder="আপনার ইমেইল দিন">
                </div>
                <div class="form-group">
                    <label>পাসওয়ার্ড</label>
                    <input type="password" id="login-password" required placeholder="পাসওয়ার্ড দিন">
                </div>
                <div id="login-error" class="form-error"></div>
                <button type="submit" class="sera-btn full-width">লগিন করুন</button>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form hidden">
                <div class="form-group">
                    <label>নাম</label>
                    <input type="text" id="signup-name" required placeholder="আপনার সম্পূর্ণ নাম">
                </div>
                <div class="form-group">
                    <label>ফোন নম্বর</label>
                    <input type="tel" id="signup-phone" required placeholder="০১XXXXXXXXX">
                </div>
                <div class="form-group">
                    <label>ইমেইল</label>
                    <input type="email" id="signup-email" required placeholder="আপনার ইমেইল দিন">
                </div>
                <div class="form-group">
                    <label>পাসওয়ার্ড</label>
                    <input type="password" id="signup-password" required placeholder="কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড">
                </div>
                <div class="form-group">
                    <label>কনফার্ম পাসওয়ার্ড</label>
                    <input type="password" id="signup-confirm-password" required placeholder="পুনরায় পাসওয়ার্ড দিন">
                </div>
                <div id="signup-error" class="form-error"></div>
                <button type="submit" class="sera-btn full-width">সাইনআপ সম্পন্ন করুন</button>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script type="module" src="product.js"></script>
</body>
</html>
