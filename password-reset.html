<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড রিসেট | Sera Product</title>
    <meta name="description" content="Sera Product অ্যাকাউন্টের পাসওয়ার্ড রিসেট করতে আপনার ইমেইল এড্রেস দিন এবং রিসেট লিংক পান।">
    <meta name="theme-color" content="#ff6a00">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/png" href="https://seraproduct.com/photo/logo.png">
    <link rel="canonical" href="https://seraproduct.com/password-reset">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="পাসওয়ার্ড রিসেট | Sera Product">
    <meta property="og:description" content="Sera Product অ্যাকাউন্টের পাসওয়ার্ড রিসেট করতে আপনার ইমেইল এড্রেস দিন।">
    <meta property="og:url" content="https://seraproduct.com/password-reset">
    <meta property="og:image" content="https://seraproduct.com/photo/facebook-preview.png">

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="পাসওয়ার্ড রিসেট | Sera Product">
    <meta name="twitter:description" content="Sera Product অ্যাকাউন্টের পাসওয়ার্ড রিসেট করতে আপনার ইমেইল এড্রেস দিন।">
    <meta name="twitter:image" content="https://seraproduct.com/photo/twitter.png">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "পাসওয়ার্ড রিসেট | Sera Product",
      "description": "Sera Product অ্যাকাউন্টের পাসওয়ার্ড রিসেট পেজ।",
      "url": "https://seraproduct.com/password-reset",
      "publisher": {
        "@type": "Organization",
        "name": "Sera Product",
        "logo": {
          "@type": "ImageObject",
          "url": "https://seraproduct.com/photo/logo.png"
        }
      }
    }
    </script>

    <link rel="stylesheet" href="password-reset.css">
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <div class="header-content">
            <a href="https://seraproduct.com" class="logo-link">
                <img src="https://seraproduct.com/photo/header.png" alt="Sera Product Logo" class="logo">
            </a>
            <span class="header-title">SERA PRODUCT</span>
        </div>
    </header>

    <!-- Main Container / Password Reset Card -->
    <main class="container">
        <div class="auth-card">
            <div class="card-icon-header" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            
            <h2>পাসওয়ার্ড রিসেট করুন</h2>
            <p class="subtitle">আপনার অ্যাকাউন্টের ইমেইল এড্রেস লিখুন। আমরা আপনার ইমেইলে পাসওয়ার্ড পরিবর্তনের জন্য একটি রিসেট লিংক পাঠিয়ে দেব।</p>

            <form id="reset-form" novalidate>
                <div class="form-group">
                    <label for="email">ইমেইল এড্রেস</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="email" name="email" placeholder="আপনার ইমেইল এড্রেস লিখুন" required autocomplete="email" inputmode="email">
                    </div>
                </div>

                <button type="submit" class="primary-btn" id="submit-btn">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    <span class="btn-text">রিসেট লিংক পাঠান</span>
                    <span class="loader hidden" aria-hidden="true"></span>
                </button>
            </form>

            <div class="card-footer-links">
                <p>পাসওয়ার্ড মনে আছে? <a href="https://seraproduct.com/reseller/login">লগইন করুন</a></p>
                <p>কোনো অ্যাকাউন্ট নেই? <a href="https://seraproduct.com/reseller/signup">নতুন অ্যাকাউন্ট তৈরি করুন</a></p>
            </div>
        </div>
    </main>

    <!-- Footer Dynamic Container -->
    <div id="footer-container">
        <div class="footer-skeleton">
            <div class="skeleton-line"></div>
        </div>
    </div>

    <!-- Custom Reusable Modal System -->
    <div id="custom-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <div class="modal-header" id="modal-header-bg">
                <div class="modal-header-title-wrap">
                    <svg id="modal-icon" class="modal-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"></svg>
                    <h3 id="modal-title">বার্তা</h3>
                </div>
                <button class="close-modal" id="modal-close-x" aria-label="বন্ধ করুন">&times;</button>
            </div>
            
            <div class="modal-body">
                <p id="modal-message"></p>
                
                <details class="error-details hidden" id="modal-details-container">
                    <summary>Technical Details (প্রযুক্তিগত বিবরণ)</summary>
                    <pre id="modal-details"></pre>
                </details>
            </div>

            <div class="modal-footer">
                <button class="primary-btn" id="modal-ok-btn">ঠিক আছে</button>
            </div>
        </div>
    </div>

    <!-- Firebase App & Modular SDKs -->
    <script type="module" src="password-reset.js"></script>
</body>
</html>
