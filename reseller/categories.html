<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff6a00">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="https://seraproduct.com/photo/logo.png">
    <title>Sera Product - সকল ক্যাটাগরি</title>
    <link rel="stylesheet" href="categories.css">
    <!-- Google Fonts for Bengali -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Professional Reseller Header -->
    <header class="reseller-header">
        <div class="header-container">
            <div class="header-left">
                <a href="https://seraproduct.com/reseller/dashboard" class="back-link" aria-label="ড্যাশবোর্ডে ফিরে যান">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </a>
                <a href="https://seraproduct.com/reseller/dashboard" class="brand-logo">
                    <img src="https://seraproduct.com/photo/header.png" alt="Sera Product Logo" loading="eager">
                </a>
            </div>
            <div class="header-right">
                <a href="https://seraproduct.com/reseller/settings" class="settings-btn" aria-label="সেটিংস">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <section class="page-header-section">
            <div class="container">
                <h1 class="page-title">সকল ক্যাটাগরি</h1>
                <p class="page-subtitle">আপনার পছন্দের ক্যাটাগরি নির্বাচন করুন</p>
                
                <!-- Lightweight Search Box -->
                <div class="search-box-wrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="categorySearch" class="category-search-input" placeholder="ক্যাটাগরি খুঁজুন..." aria-label="ক্যাটাগরি খুঁজুন">
                </div>
            </div>
        </section>

        <section class="categories-section">
            <div class="container">
                <!-- Categories Grid Container -->
                <div id="categoriesGrid" class="categories-grid">
                    <!-- Skeletons Loaded Initially -->
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="state-container hidden">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <p>কোনো ক্যাটাগরি পাওয়া যায়নি</p>
                </div>

                <!-- Error State -->
                <div id="errorState" class="state-container hidden">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e85f00" stroke-width="1.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    <p>ক্যাটাগরি লোড করতে সমস্যা হয়েছে। অনুগ্রহ করে কিছুক্ষণ পর আবার চেষ্টা করুন।</p>
                    <button id="retryBtn" class="retry-btn">আবার চেষ্টা করুন</button>
                </div>

                <!-- Load More Section -->
                <div id="loadMoreContainer" class="load-more-container hidden">
                    <button id="loadMoreBtn" class="load-more-btn">আরও দেখুন</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Dynamic Footer Container -->
    <div id="footer-container"></div>

    <!-- App Script -->
    <script type="module" src="categories.js"></script>
</body>
</html>
