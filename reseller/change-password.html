<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড পরিবর্তন | Sera Product</title>
    
    <!-- SEO & Metadata -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ff6a00">
    <link rel="icon" type="image/png" href="https://seraproduct.com/photo/logo.png">

    <!-- Open Graph / Social Preview -->
    <meta property="og:title" content="পাসওয়ার্ড পরিবর্তন | Sera Product">
    <meta property="og:description" content="Sera Product রিসেলার অ্যাকাউন্টের পাসওয়ার্ড পরিবর্তন করুন।">
    <meta property="og:image" content="https://seraproduct.com/photo/facebook-preview.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://seraproduct.com/reseller/change-password">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="পাসওয়ার্ড পরিবর্তন | Sera Product">
    <meta name="twitter:description" content="Sera Product রিসেলার অ্যাকাউন্টের পাসওয়ার্ড পরিবর্তন করুন।">
    <meta name="twitter:image" content="https://seraproduct.com/photo/twitter.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="change-password.css">
</head>
<body>

    <!-- Initial Loading Screen -->
    <div id="initial-loader" class="initial-loader">
        <div class="spinner"></div>
        <p>অপেক্ষা করুন...</p>
    </div>

    <!-- Header Section -->
    <header class="site-header">
        <div class="header-container">
            <div class="header-left">
                <a href="https://seraproduct.com/reseller/dashboard" class="logo-link">
                    <img src="https://seraproduct.com/photo/header.png" alt="Sera Product Logo" class="header-logo">
                </a>
            </div>
            <div class="header-right">
                <a href="https://seraproduct.com/reseller/dashboard" class="back-btn">
                    <svg class="icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>ফিরে যান</span>
                </a>
                <button id="hamburger-btn" class="hamburger-btn" aria-label="মিনিউ খুলুন">
                    <svg class="icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>
        </div>
        <!-- Mobile Dropdown Menu -->
        <div id="mobile-menu" class="mobile-menu">
            <a href="https://seraproduct.com/reseller/dashboard">ড্যাশবোর্ড</a>
            <a href="https://seraproduct.com/reseller/change-password" class="active">পাসওয়ার্ড পরিবর্তন</a>
            <button id="mobile-logout-btn" class="mobile-logout">লগআউট</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="password-card">
                <div class="card-header">
                    <h2>পাসওয়ার্ড পরিবর্তন করুন</h2>
                    <p>আপনার অ্যাকাউন্টের নিরাপত্তার জন্য নিয়মিত পাসওয়ার্ড পরিবর্তন করুন।</p>
                </div>

                <div id="error-alert" class="alert error-alert hidden" role="alert"></div>

                <form id="password-form" novalidate>
                    <!-- Current Password -->
                    <div class="form-group">
                        <label for="current-password">বর্তমান পাসওয়ার্ড</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="current-password" required placeholder="আপনার বর্তমান পাসওয়ার্ড দিন">
                            <button type="button" class="toggle-password" data-target="current-password" aria-label="পাসওয়ার্ড দেখান বা লুকান">
                                <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <!-- New Password -->
                    <div class="form-group">
                        <label for="new-password">নতুন পাসওয়ার্ড</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="new-password" required placeholder="কমপক্ষে ৬ অক্ষরের নতুন পাসওয়ার্ড">
                            <button type="button" class="toggle-password" data-target="new-password" aria-label="পাসওয়ার্ড দেখান বা লুকান">
                                <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Confirm New Password -->
                    <div class="form-group">
                        <label for="confirm-password">নতুন পাসওয়ার্ড নিশ্চিত করুন</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirm-password" required placeholder="নতুন পাসওয়ার্ড আবার লিখুন">
                            <button type="button" class="toggle-password" data-target="confirm-password" aria-label="পাসওয়ার্ড দেখান বা লুকান">
                                <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="submit-btn">পাসওয়ার্ড পরিবর্তন করুন</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer Container Loaded via Fetch -->
    <div id="footer-container"></div>

    <!-- Custom Popup Modal -->
    <div id="custom-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
        <div class="modal-box">
            <div id="modal-icon-container" class="modal-icon-container">
                <!-- Dynamic SVG Icon -->
            </div>
            <h3 id="modal-title">শিরোনাম</h3>
            <p id="modal-message">মেসেজ এখানে প্রদর্শিত হবে।</p>
            <div id="modal-action-container">
                <button id="modal-action-btn" class="modal-btn">ঠিক আছে</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script type="module" src="change-password.js"></script>
</body>
</html>
