<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোডাক্ট অর্ডার - Sera Product</title>
    <link rel="icon" type="image/png" href="https://seraproduct.com/photo/logo.png">
    <link rel="stylesheet" href="product.css">
</head>
<body>

    <!-- Header Section -->
    <header class="site-header">
        <div class="header-container">
            <button class="back-btn" id="backBtn" aria-label="ফিরে যান">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="logo-area">
                <img src="https://seraproduct.com/photo/header.png" alt="Sera Product Logo" class="site-logo">
            </div>
            <div class="header-actions">
                <button id="logoutBtn" class="icon-btn" aria-label="লগআউট" style="display:none;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-content">
        <!-- Global Loader / Skeleton -->
        <div id="loadingState" class="loading-container">
            <div class="skeleton skeleton-box"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text short"></div>
        </div>

        <!-- Error State Container -->
        <div id="errorState" class="error-container" style="display: none;">
            <div class="error-card">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <h3 id="errorMessage">এই পণ্যটি পাওয়া যায়নি!</h3>
                <button class="primary-btn" onclick="window.history.back()">ফিরে যান</button>
            </div>
        </div>

        <!-- Product Content Section -->
        <div id="productContent" class="product-layout" style="display: none;">
            
            <!-- Left: Gallery & Details -->
            <div class="product-left-col">
                <!-- Image Gallery -->
                <div class="gallery-card">
                    <div class="main-image-wrapper">
                        <img id="mainImage" src="" alt="Product Image">
                        <button id="favoriteBtn" class="fav-icon-btn" aria-label="পছন্দের তালিকায় রাখুন">
                            <svg id="favSvg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        </button>
                        <button id="downloadModalBtn" class="download-icon-btn" aria-label="ছবি ডাউনলোড">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            <span>ছবি ডাউনলোড</span>
                        </button>
                    </div>
                    <div id="thumbnailContainer" class="thumbnail-container"></div>
                </div>

                <!-- Product Info & Description -->
                <div class="info-card">
                    <h1 id="productName" class="product-title"></h1>
                    
                    <div class="price-box">
                        <div class="current-price" id="currentPriceDisplay"></div>
                        <div class="old-price-discount" id="oldPriceDisplay"></div>
                    </div>

                    <div class="customer-max-price-alert" id="customerMaxPriceDisplay"></div>

                    <div class="warranty-badge" id="warrantyDisplay"></div>

                    <div class="description-section">
    <h3>পণ্যের বিবরণ</h3>
    <button id="copyDescBtn" class="secondary-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        ডেসক্রিপশন কপি করুন
    </button>
    <p id="productDescriptionText"></p>
                    </div>
                </div>
            </div>

            <!-- Right: Order Form & Variants -->
            <div class="product-right-col">
                <div class="order-form-card">
                    <h2>অর্ডার কনফার্ম করুন</h2>
                    
                    <!-- Variants Container -->
                    <div id="variantsSection" class="variants-section"></div>

                    <!-- Order Form Fields -->
                    <form id="orderForm" class="form-grid">
                        <div class="form-group">
                            <label>কাস্টমারের নাম *</label>
                            <input type="text" id="customerNameInput" placeholder="পূর্ণ নাম লিখুন" required>
                        </div>

                        <div class="form-group">
                            <label>কাস্টমারের মোবাইল নাম্বার *</label>
                            <input type="tel" id="customerPhoneInput" placeholder="01XXXXXXXXX" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>কাস্টমারের বিভাগ *</label>
                                <input type="text" id="customerVibagInput" placeholder="যেমন: সিলেট" required>
                            </div>
                            <div class="form-group">
                                <label>কাস্টমারের জেলা *</label>
                                <input type="text" id="customerJelaInput" placeholder="যেমন: সুনামগঞ্জ" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>উপজেলা/থানা *</label>
                            <input type="text" id="upojelaThanaInput" placeholder="যেমন: ছাতক" required>
                        </div>

                        <div class="form-group">
                            <label>কাস্টমার নোট (Optional)</label>
                            <textarea id="customerNoteInput" placeholder="বিশেষ কোনো নির্দেশনা থাকলে লিখুন"></textarea>
                        </div>

                        <!-- Quantity Selector -->
                        <div class="form-group">
                            <label>পরিমাণ (Quantity)</label>
                            <div class="quantity-selector">
                                <button type="button" id="qtyMinus">-</button>
                                <span id="quantityDisplay">1</span>
                                <button type="button" id="qtyPlus">+</button>
                            </div>
                        </div>

                        <!-- Delivery Location -->
                        <div class="form-group">
                            <label>ডেলিভারি এলাকা নির্বাচন করুন *</label>
                            <div class="radio-group">
                                <label><input type="radio" name="deliverySite" value="inside_dhaka" checked> ঢাকার ভিতরে (৳৬০)</label>
                                <label><input type="radio" name="deliverySite" value="outside_dhaka"> ঢাকার বাইরে (৳১২০)</label>
                            </div>
                        </div>

                        <!-- Delivery Charge Advance System -->
                        <div class="form-group">
                            <label>ডেলিভারি চার্জ অগ্রিম নিয়েছেন? *</label>
                            <div class="radio-group">
                                <label><input type="radio" name="deliveryChargeStatus" value="no" checked> না</label>
                                <label><input type="radio" name="deliveryChargeStatus" value="yes"> হ্যাঁ</label>
                            </div>
                        </div>

                        <!-- Advance Payment Details Container -->
                        <div id="advancePaymentBox" class="advance-box" style="display: none;">
                            <div class="advance-alert">
                                <p>ডেলিভারি চার্জ অগ্রিম পাঠাতে হবে।</p>
                                <p><strong>বিকাশ নম্বর: 01615615260</strong></p>
                            </div>
                            <div class="form-group">
                                <label>Transaction ID *</label>
                                <input type="text" id="transectionIdInput" placeholder="ট্রানজেকশন আইডি লিখুন">
                            </div>
                            <div class="form-group">
                                <label>যে নম্বর থেকে টাকা পাঠানো হয়েছে *</label>
                                <input type="tel" id="sendMoneyNumberInput" placeholder="01XXXXXXXXX">
                            </div>
                            <div class="form-group">
                                <label>কত টাকা পাঠানো হয়েছে *</label>
                                <input type="number" id="sendDeliveryChargeInput" placeholder="টাকার পরিমাণ">
                            </div>
                        </div>

                        <!-- Order Summary Box -->
                        <div class="order-summary-box">
                            <div class="summary-row"><span>পণ্যের দাম:</span> <span id="summaryProdPrice">৳০</span></div>
                            <div class="summary-row"><span>ডেলিভারি চার্জ:</span> <span id="summaryDelivCharge">৳৬০</span></div>
                            <div class="summary-row total-row"><span>মোট (Total):</span> <span id="summaryTotalPrice">৳০</span></div>
                        </div>

                        <button type="submit" id="submitOrderBtn" class="primary-btn submit-btn">অর্ডার কনফার্ম করুন</button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <!-- Image Download Modal -->
    <div id="downloadModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3>ছবি ডাউনলোড করুন</h3>
            <button class="secondary-btn modal-action-btn" id="downloadSelectedModalBtn">সিলেক্ট করা ছবি ডাউনলোড করুন</button>
            <button class="primary-btn modal-action-btn" id="downloadAllModalBtn">সব ছবি ডাউনলোড করুন</button>
            <button class="close-modal-btn" id="closeDownloadModal">বাতিল</button>
        </div>
    </div>

    <!-- Order Success Popup Modal -->
    <div id="successModal" class="modal-overlay" style="display: none;">
        <div class="modal-card success-card-content">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#28a745" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <h3>অর্ডার সফলভাবে সম্পন্ন হয়েছে!</h3>
            <button class="secondary-btn" id="copyJsonBtn">কপি JSON</button>
            <div class="success-actions">
                <a href="https://seraproduct.com/reseller/dashboard" class="primary-btn link-btn">ড্যাশবোর্ড</a>
                <a href="https://seraproduct.com/reseller/my-orders" class="secondary-btn link-btn">আমার অর্ডারস সমূহ</a>
            </div>
        </div>
    </div>

    <!-- Dynamic Footer Container -->
    <div id="footerContainer"></div>

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, limit, getDocs, addDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration - Your Config Here
        const firebaseConfig = {
  apiKey: "AIzaSyBRSt2aoSJ-lumYAWGAXE6ncui7__TqJ4E",
  authDomain: "sera-product.firebaseapp.com",
  projectId: "sera-product",
  storageBucket: "sera-product.firebasestorage.app",
  messagingSenderId: "516762224598",
  appId: "1:516762224598:web:b6a571f355a8a4a97c0677",
  measurementId: "G-RLMWH43FXX"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expose Firebase modules to window for app.js
        window.firebaseAppModules = { auth, db, doc, getDoc, collection, query, where, limit, getDocs, addDoc, deleteDoc, serverTimestamp, signOut, onAuthStateChanged };
    </script>
    <script src="product.js"></script>
</body>
</html>
