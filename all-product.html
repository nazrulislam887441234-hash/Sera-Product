  <style>

    /* =====================================================
       SERA PRODUCT — MOBILE BUTTON NAV
       ===================================================== */

    .sp-mobile-nav {

      /* Hidden on desktop */
      display: none;

      position: fixed;

      left: 12px;
      right: 12px;
      bottom: 12px;

      z-index: 99999;

      height: 66px;

      padding: 6px;

      align-items: stretch;

      justify-content: space-between;

      gap: 3px;

      background:
        rgba(255,255,255,.96);

      border:
        1px solid
        rgba(0,0,0,.07);

      border-radius: 20px;

      box-shadow:
        0 10px 35px
        rgba(0,0,0,.16),
        0 2px 8px
        rgba(0,0,0,.06);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      font-family:
        "Hind Siliguri",
        "Noto Sans Bengali",
        Arial,
        sans-serif;

      box-sizing: border-box;
    }


    .sp-mobile-nav *,
    .sp-mobile-nav *::before,
    .sp-mobile-nav *::after {
      box-sizing: border-box;
    }


    /* =====================================================
       NAV ITEM
       ===================================================== */

    .sp-mobile-nav .sp-nav-item {

      position: relative;

      flex: 1 1 0;

      min-width: 0;

      height: 54px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 3px;

      padding: 4px 2px;

      border-radius: 15px;

      color: #777;

      background: transparent;

      text-decoration: none;

      -webkit-tap-highlight-color: transparent;

      transition:
        color .25s ease,
        background .25s ease,
        transform .2s ease;
    }


    /* =====================================================
       SVG ICON
       ===================================================== */

    .sp-mobile-nav .sp-nav-item svg {

      width: 21px;
      height: 21px;

      flex-shrink: 0;

      fill: none;

      stroke: currentColor;

      stroke-width: 1.8;

      stroke-linecap: round;

      stroke-linejoin: round;

      transition:
        transform .25s ease,
        stroke-width .25s ease;
    }


    /* =====================================================
       TEXT
       ===================================================== */

    .sp-mobile-nav .sp-nav-item span {

      display: block;

      max-width: 100%;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 10px;

      font-weight: 600;

      line-height: 1.2;

      letter-spacing: -.1px;
    }


    /* =====================================================
       ACTIVE ITEM
       ===================================================== */

    .sp-mobile-nav .sp-nav-item.active {

      color: #ff6b35;

      background:
        rgba(255,107,53,.10);

      box-shadow:
        inset 0 0 0 1px
        rgba(255,107,53,.08);
    }


    .sp-mobile-nav .sp-nav-item.active svg {

      stroke-width: 2.2;

      transform:
        translateY(-1px);
    }


    /* Orange active indicator */
    .sp-mobile-nav .sp-nav-item.active::before {

      content: "";

      position: absolute;

      top: 3px;

      left: 50%;

      width: 22px;

      height: 3px;

      transform:
        translateX(-50%);

      border-radius: 0 0 10px 10px;

      background:
        linear-gradient(
          90deg,
          #ff6b35,
          #ff9b70
        );

      box-shadow:
        0 2px 8px
        rgba(255,107,53,.28);
    }


    /* =====================================================
       TOUCH EFFECT
       ===================================================== */

    .sp-mobile-nav .sp-nav-item:active {

      transform:
        scale(.94);
    }


    /* =====================================================
       MOBILE ONLY
       ===================================================== */

    @media (max-width: 767px) {

      .sp-mobile-nav {
        display: flex;
      }

      /*
       * Prevent fixed navigation from covering
       * the last content of the page.
       */
      body {
        padding-bottom: 88px;
      }

    }


    /* =====================================================
       VERY SMALL MOBILE
       ===================================================== */

    @media (max-width: 360px) {

      .sp-mobile-nav {

        left: 8px;
        right: 8px;
        bottom: 8px;

        height: 62px;

        border-radius: 18px;

        padding: 5px;
      }


      .sp-mobile-nav .sp-nav-item {

        height: 52px;

        border-radius: 14px;
      }


      .sp-mobile-nav .sp-nav-item svg {

        width: 20px;
        height: 20px;
      }


      .sp-mobile-nav .sp-nav-item span {

        font-size: 9px;
      }

    }


    /* =====================================================
       REDUCED MOTION
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      .sp-mobile-nav *,
      .sp-mobile-nav *::before,
      .sp-mobile-nav *::after {

        transition: none !important;

        animation: none !important;
      }

    }

  </style>


  <!-- =========================
       AUTO ACTIVE PAGE
       ========================= -->
  <script>
    (function () {

      const currentPath =
        window.location.pathname
          .replace(/\/+$/, "")
          .toLowerCase();

      const navItems =
        document.querySelectorAll(
          ".sp-mobile-nav .sp-nav-item"
        );


      navItems.forEach(function (item) {

        const page =
          item.getAttribute("data-page");


        let isActive = false;


        /* HOME */
        if (
          page === "home" &&
          (
            currentPath === "" ||
            currentPath === "/" ||
            currentPath === "/index.html"
          )
        ) {
          isActive = true;
        }


        /* RESELLER */
        if (
          page === "reseller" &&
          (
            currentPath === "/reseller" ||
            currentPath === "/reseller.html"
          )
        ) {
          isActive = true;
        }


        /* CATEGORIES */
        if (
          page === "categories" &&
          (
            currentPath === "/categories" ||
            currentPath === "/categories.html"
          )
        ) {
          isActive = true;
        }


        /* ALL PRODUCTS */
        if (
          page === "products" &&
          (
            currentPath === "/all-product" ||
            currentPath === "/all-product.html"
          )
        ) {
          isActive = true;
        }


        /* PROFILE */
        if (
          page === "profile" &&
          (
            currentPath === "/profile" ||
            currentPath === "/profile.html"
          )
        ) {
          isActive = true;
        }


        if (isActive) {
          item.classList.add("active");
          item.setAttribute(
            "aria-current",
            "page"
          );
        }

      });

    })();
  </script>
